name: Installer

# Builds the installer of a release once it is published, and attaches it to that release
# (gestion-projet/depot/versions-et-releases.md).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    name: Installer
    runs-on: windows-latest
    # About 10 minutes expected (restore, publication, installation of NSIS, compression of the installer), plus half.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tag is v<MAJOR.MINOR.PATCH> (gestion-projet/depot/versions-et-releases.md); the assembly and file versions
      # are numeric only, so any other tag stops the build rather than producing a mislabelled installer. The tag name
      # comes through the environment, never expanded into the script.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if (-not ($env:TAG -match '^v(\d+\.\d+\.\d+)$')) {
            throw "The tag '$env:TAG' is not v<MAJOR.MINOR.PATCH>."
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Framework-dependent publication into TVRename/bin/Release/net10.0-windows/publish, where Installer.nsi takes
      # the files it installs.
      - name: Publish the application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet publish TVRename/TVRename.csproj --configuration Release
          -p:Version=$env:VERSION -p:AssemblyVersion=$env:VERSION -p:FileVersion=$env:VERSION

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: 3.12

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: makensis /V3 /WX "/DVERSION=$env:VERSION" "/DTAG=$env:TAG" Installer.nsi

      # GitHub CLI, installed on the runner: no third-party action gets the token that writes to the releases.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG "TVRename-$env:TAG-Installer.exe" --repo $env:GITHUB_REPOSITORY
