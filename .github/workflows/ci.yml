name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request makes the run of its previous commit useless: that run is cancelled rather than left to
# consume the quota of the GitHub API (gestion-projet/depot/integration-continue-ci.md). Each push to main has a group
# of its own: a shared one would hold a second run pending, and cancel it when a third one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, on Windows, the only platform where the application (net10.0-windows) builds and its tests run; the tests
  # of the repository run there too, so that each push runs the tests once (choix-implementation/outillage.md).
  build-and-test:
    name: Build & tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # On a pull request, the merge commit (refs/pull/<number>/merge) and its first parent, the head of main it merges
      # into: their difference is the pull request as it would be merged. The whole history, tags included, lets the
      # SonarQube Cloud analysis tell the new code apart, blame each issue and name the last published version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A pull request runs only the tests that its changes can fail; a push to main or a run on demand runs them all
      # (gestion-projet/depot/integration-continue-ci.md). Safe by default: a file that no pattern leaves out is a
      # source; a moved file counts at both paths (--no-renames). The steps that follow are skipped accordingly, which
      # leaves the job, hence its required check, in place.
      - name: Classify the changed files
        id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "sources=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          git -C "$GITHUB_WORKSPACE" diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          # Documentation, and tooling that no test runs: the tests of the repository check what they read of it.
          not_sources='^(\.speckit/|\.claude/|scripts/|\.github/|[^/]+\.md$|\.gitignore$)'
          { grep -vE "$not_sources" changed.txt || true; grep -xF .github/workflows/ci.yml changed.txt || true; } > sources.txt
          echo "sources=$([ -s sources.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          for list in changed sources; do
            echo "::group::$list ($(wc -l < "$list.txt"))"; cat "$list.txt"; echo "::endgroup::"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        if: steps.changes.outputs.sources == 'true'
        run: dotnet build TVRename.slnx --configuration Release

      # The only run of the tests: it collects the coverage (OpenCover) that the SonarQube Cloud analysis reports, out of
      # the working tree so that the analysis does not index the reports.
      - name: Run the tests
        if: steps.changes.outputs.sources == 'true'
        run: >-
          dotnet test TVRename.slnx --configuration Release --no-build
          --results-directory "${{ runner.temp }}/TestResults"
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Without a source changed, only the tests that confront the files of the repository with their rules, which
      # reference nothing of the application: it is not built, and no coverage is collected, no code it measures having
      # changed.
      - name: Run the tests of the repository
        if: steps.changes.outputs.sources != 'true'
        run: dotnet test tests/TVRename.Repository.Tests --configuration Release

      # SonarQube Cloud analysis, with the coverage of the tests run above, for the quality gate, the decoration of the
      # pull request and the indicators of the README (gestion-projet/depot/analyse-de-la-qualite-du-code.md). Its steps
      # carry on after a failure (service down, token missing on a pull request from a fork): an analysis that cannot
      # complete never fails the check of non-regression. The scanner switches off TreatWarningsAsErrors in the build it
      # wraps: it rebuilds, after the strict build and the tests above, rather than standing in for them
      # (choix-implementation/outillage.md).
      #
      # Left out of the coverage: the code generated by the Windows Forms designer, the PowerShell scripts of the
      # tooling, whose coverage no test collects (only that of the .NET tests is), and the code whose removal is planned in Phase 4, each
      # exclusion going away with its code: automatic update channel (#7), movies (#9), RSS functions (#12).
      # The version is the last published one, once there is one: the new code is what changed since that release.
      - name: Begin the SonarQube Cloud analysis
        id: sonar-begin
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COVERAGE: ${{ steps.changes.outputs.sources }}
        run: |
          $coverageExclusions = @(
            '**/*.Designer.cs'
            'scripts/**'
            'TVRename/Utility/VersionUpdater.cs', 'TVRename/Utility/Release.cs', 'TVRename/Utility/ServerRelease.cs'
            'TVRename/Forms/Supporting/UpdateNotification.cs'
            'TVRename/**/*Movie*.cs', 'TVRename/Sources/YTS/**', 'TVRename/Forms/Tools/YTSRecomendations/**'
            'TVRename/ScanActivity/Finders/RSSFinder.cs', 'TVRename/Exporter/UpcomingRSS.cs'
          ) -join ','
          $arguments = @(
            '/k:Tetram76_tvrename', '/o:tetram76', '/d:sonar.host.url=https://sonarcloud.io'
            "/d:sonar.token=$env:SONAR_TOKEN"
            "/d:sonar.coverage.exclusions=$coverageExclusions"
          )
          if (git tag --merged HEAD) { $arguments += "/v:$(git describe --tags --abbrev=0)" }
          if ($env:COVERAGE -eq 'true') {
            $reports = ($env:RUNNER_TEMP -replace '\\', '/') + '/TestResults/**/coverage.opencover.xml'
            $arguments += "/d:sonar.cs.opencover.reportsPaths=$reports"
          }
          dotnet tool restore
          dotnet tool run dotnet-sonarscanner begin @arguments

      - name: Build for the SonarQube Cloud analysis
        id: sonar-build
        if: steps.sonar-begin.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet build ${{ steps.changes.outputs.sources == 'true' && 'TVRename.slnx' || 'tests/TVRename.Repository.Tests' }}
          --configuration Release --no-incremental

      - name: End the SonarQube Cloud analysis
        if: steps.sonar-build.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end "/d:sonar.token=$env:SONAR_TOKEN"
